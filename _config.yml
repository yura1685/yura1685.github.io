plugins:
  - jekyll-sitemap

# .md 内の ``` コードブロックを Jekyll ではなく Prism でハイライトする
kramdown:
  syntax_highlighter_opts:
    disable: true

# atcoder/library/*.md に _layouts/library.html を自動で適用し、一覧にも載せる
defaults:
  - scope:
      path: "atcoder/library"
    values:
      layout: library
      library: true

# front matter のない .md（記事本文）を勝手に HTML ページ化しない
require_front_matter: true
