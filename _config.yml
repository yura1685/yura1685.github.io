plugins:
  - jekyll-sitemap

# ライブラリ: _library/*.md → /atcoder/library/<ファイル名>.html を生成
collections:
  library:
    output: true
    permalink: /atcoder/library/:path.html

# コードブロックを <pre><code class="language-python"> のまま出力し、Prism でハイライトする
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

# _library のファイルには自動で _layouts/library.html を適用
defaults:
  - scope:
      type: library
    values:
      layout: library
