# サイトのアドレス（ローカルで jekyll build したときもリンクが正しくなるように明記）
url: "https://yura1685.github.io"
baseurl: ""

plugins:
  - jekyll-sitemap

# .md 内の ``` コードブロックを Jekyll ではなく Prism でハイライトする
kramdown:
  syntax_highlighter_opts:
    disable: true

# atcoder/library/*.md に _layouts/library.html を自動で適用し、一覧にも載せる
# （コードの色付け・数式と Copy ボタンも読み込む）
defaults:
  - scope:
      path: "atcoder/library"
    values:
      layout: library
      library: true
      code_and_math: true
      scripts:
        - /assets/js/copy-code.js

# _problems/ の問題（自作問題ページ）。1問ずつのページは作らず、problems/index.html に箱として並べる
collections:
  problems:
    output: false
